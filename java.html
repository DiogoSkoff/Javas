<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">

    <section class="coluna">
      <h1>Cadastro</h1>
      <form id="cadastroForm" novalidate>

        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Ex.: Maria da Silva" required>
          <span class="erro" id="erroNome"></span>
        </div>

        <div class="campo">
          <label for="email">E-mail institucional</label>
          <input type="email" id="email" placeholder="nome@escola.edu.br" required>
          <span class="erro" id="erroEmail"></span>
        </div>

        <div class="campo">
          <label for="senha">Senha de acesso</label>
          <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required>
          <span class="erro" id="erroSenha"></span>
        </div>

        <div class="campo">
          <label for="confirmaSenha">Confirmação de senha</label>
          <input type="password" id="confirmaSenha" placeholder="Digite a senha novamente" required>
          <span class="erro" id="erroConfirma"></span>
        </div>

        <div class="campo">
          <label for="perfil">Perfil técnico</label>
          <select id="perfil" required>
            <option value="">Selecione uma área...</option>
            <option value="Redes">Redes</option>
            <option value="Desenvolvimento">Desenvolvimento</option>
            <option value="Suporte">Suporte</option>
          </select>
          <span class="erro" id="erroPerfil"></span>
        </div>

        <div class="campo campo-check">
          <input type="checkbox" id="termos" required>
          <label for="termos">Li e aceito os termos de uso</label>
          <span class="erro" id="erroTermos"></span>
        </div>

        <button type="submit">Cadastrar</button>
      </form>
    </section>

    <section class="coluna painel">
      <h2>Dados cadastrados</h2>
      <p id="mensagemSucesso" class="sucesso"></p>
      <dl>
        <dt>Nome</dt>
        <dd id="saidaNome">—</dd>
        <dt>E-mail</dt>
        <dd id="saidaEmail">—</dd>
        <dt>Perfil técnico</dt>
        <dd id="saidaPerfil">—</dd>
      </dl>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
